# OWASP Top 10 2021 mappings
owasp_mappings:
  "A01:2021":
    name: "Broken Access Control"
    types:
      - path_traversal
      - open_redirect
      - csrf
  
  "A02:2021":
    name: "Cryptographic Failures"
    types:
      - hardcoded_secrets
      - weak_hashing
      - weak_randomness
  
  "A03:2021":
    name: "Injection"
    types:
      - sql_injection
      - command_injection
      - ldap_injection
      - xpath_injection
      - xss
      - insecure_eval
  
  "A04:2021":
    name: "Insecure Design"
    types:
      - arbitrary_file_upload
  
  "A05:2021":
    name: "Security Misconfiguration"
    types:
      - xxe
      - debug_mode_prod
      - permissive_cors
      - missing_security_headers
  
  "A06:2021":
    name: "Vulnerable and Outdated Components"
    types:
      - buffer_overflow
      - use_after_free
      - integer_overflow
      - redos
  
  "A07:2021":
    name: "Identification and Authentication Failures"
    types:
      - broken_jwt_auth
  
  "A08:2021":
    name: "Software and Data Integrity Failures"
    types:
      - insecure_deserialization
  
  "A09:2021":
    name: "Security Logging and Monitoring Failures"
    types:
      - log_injection
